name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography psutil pywin32 requests

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console --name "WebsiteBlocker" --add-data "data;data" main.py

      - name: Compile Inno Setup Installer
        uses: Calin-Popescu/action-inno-setup@v1
        with:
          filepath: 'installer.iss'

      - name: Upload Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ../dist-installer/WebsiteBlocker-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
